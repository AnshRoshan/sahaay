# Render Blueprint: web app + Postgres + cron tick. Gemma/TabPFN run as separate services (see services/).
#
# Migrations are NOT run from buildCommand. A build container on Render is ephemeral and can be
# re-run at any time; `drizzle-kit push --force` there would silently mutate the live database on
# every deploy with no history and no way back. Schema changes are committed to ./drizzle and
# applied deliberately, once, from a Render shell:
#
#   npx drizzle-kit migrate        # inside the service shell, DATABASE_URL is already set
#
# Render has no release phase, so this is a documented manual step rather than automation that
# could fire against the wrong database.
databases:
  - name: sahaay-db
    # The free Postgres plan is deleted 30 days after creation. It cannot hold a shop's real
    # sales history, ledger, or decisions.
    plan: starter
    databaseName: sahaay
services:
  - type: web
    name: sahaay-web
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: sahaay-db, property: connectionString }
      - key: SAHAAY_ACCESS_CODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Demo data and the time-machine write synthetic movements into the same ledger as real
      # business truth. Off by default; only an instance meant for demos should set this to 1.
      - key: DEMO_MODE
        value: "0"
      - key: GEMMA_BASE_URL
        sync: false
      - key: TABPFN_URL
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
  - type: cron
    name: sahaay-tick
    runtime: node
    schedule: "*/15 * * * *"
    buildCommand: "true"
    startCommand: 'curl -fsS -X POST --retry 5 --retry-delay 10 --retry-connrefused -H "Authorization: Bearer $CRON_SECRET" "$SAHAAY_URL/api/cron/tick"'
    envVars:
      - key: CRON_SECRET
        fromService: { type: web, name: sahaay-web, envVarKey: CRON_SECRET }
      - key: SAHAAY_URL
        sync: false
